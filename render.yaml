services:
  # Customer-facing API Demo Dashboard
  - type: web
    name: neurovest-api-demo
    runtime: python
    region: oregon
    plan: free
    branch: claude/assess-codebase-AqOfb
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run api_demo.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: false
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: false
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: false
    healthCheckPath: /_stcore/health

  # Comprehensive Dashboard (Internal Tool)
  - type: web
    name: neurovest-dashboard
    runtime: python
    region: oregon
    plan: free
    branch: claude/assess-codebase-AqOfb
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run dashboard_comprehensive.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: STREAMLIT_SERVER_HEADLESS
        value: true
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: false
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: false
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: false
    healthCheckPath: /_stcore/health
