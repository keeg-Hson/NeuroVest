# MACRO MODEL GROUPS
# These define which assets to combine for macro models
macro_groups:
  all_equities:
    name: "All Equity ETFs Combined"
    includes: ["equity_major_indices", "equity_international", "equity_sectors", "equity_style", "equity_thematic"]
    enabled: true

  all_crypto:
    name: "All Cryptocurrencies Combined"
    includes: ["crypto"]
    enabled: true

  us_equities_only:
    name: "US Equity ETFs Only"
    includes: ["equity_major_indices", "equity_sectors", "equity_style", "equity_thematic"]
    enabled: true

  bonds_only:
    name: "All Bonds Combined"
    includes: ["bonds"]
    enabled: true

  commodities_only:
    name: "All Commodities Combined"
    includes: ["commodities"]
    enabled: true

  diversified_portfolio:
    name: "Diversified Multi-Asset"
    includes: ["equity_major_indices", "bonds", "commodities"]
    enabled: true

# GLOBAL SETTINGS
settings:
  # Data download
  start_date: "2000-01-01"
  refresh_schedule: "daily"  # daily, weekly, manual

  # Training
  train_test_split: 0.8
  horizon: 1  # prediction horizon in days
  fee_bps: 2.0
  slippage_bps: 3.0

  # Threshold settings
  # auto_threshold: if true, calculates threshold as vol_multiplier * daily_volatility
  # This overrides the per-asset threshold values above
  auto_threshold: false
  vol_multiplier: 0.5  # threshold = vol_multiplier * rolling_volatility

  # Labeling method
  # "fixed_threshold" - label 1 if return > threshold (current method)
  # "triple_barrier" - label based on TP/SL hit within time horizon
  # "return_tercile" - label based on return percentile (0=bottom, 1=middle, 2=top)
  labeling_method: "fixed_threshold"

  # Triple-barrier settings (only used if labeling_method = "triple_barrier")
  triple_barrier:
    tp_multiplier: 2.0  # take profit at tp_multiplier * volatility
    sl_multiplier: 1.0  # stop loss at sl_multiplier * volatility
    max_holding_days: 5  # max days before time exit

  # Model ensemble
  models: ["xgboost", "lightgbm", "catboost"]

  # API
  api_enabled: true
  api_port: 8000
  api_host: "0.0.0.0"

  # Results storage
  results_dir: "results"
  models_dir: "models"
  logs_dir: "logs"
