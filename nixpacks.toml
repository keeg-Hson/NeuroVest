[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[phases.build]
# No build phase needed for Streamlit/Python apps

[start]
# Railway will detect service type from Procfile
cmd = "echo 'Service started - see Procfile for actual commands'"
